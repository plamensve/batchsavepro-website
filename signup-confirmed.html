<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Email confirmation — BatchSave Pro</title>
  <style>
    :root{font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#13213d;background:#f4f7fd}
    body{min-height:100vh;display:grid;place-items:center;margin:0;padding:20px;box-sizing:border-box}
    main{max-width:490px;background:white;padding:32px;border:1px solid #dce5f3;border-radius:18px;box-shadow:0 20px 60px #142a531c}
    h1{margin:0 0 12px;font-size:26px}p{margin:0 0 14px;color:#465a7b}a{color:#245fe5}
  </style>
</head>
<body>
<main>
  <h1 id="heading">Verifying your email…</h1>
  <p id="details">Checking your account securely.</p>
  <p>Once verified, return to the BatchSave Pro extension and sign in.</p>
  <a href="/">Return to BatchSave Pro</a>
</main>
<script>
(async()=>{
  const heading=document.getElementById("heading");
  const details=document.getElementById("details");
  const fragment=new URLSearchParams(location.hash.slice(1));
  const token=fragment.get("access_token");
  const verificationType=fragment.get("type");
  // Supabase implicit flow places bearer tokens in the URL fragment.
  // Remove those credentials before loading analytics or any other network resource.
  history.replaceState(null,"",location.pathname);
  if(!token||!["signup","email"].includes(verificationType)){
    heading.textContent="Confirmation page";
    details.textContent="Open the newest account confirmation link in your email. If you already confirmed, return to the extension and sign in.";
    return;
  }
  try{
    const response=await fetch("https://gcfyaaqqsqrjwujpymjz.supabase.co/auth/v1/user",{
      headers:{
        "apikey":"sb_publishable_S2ErUIpwWy-lmia3pEHwsw_803Cbb9Q",
        "Authorization":"Bearer "+token
      },
      cache:"no-store",referrerPolicy:"no-referrer"
    });
    if(!response.ok)throw Error("Account verification failed");
    const user=await response.json();
    if(!user?.id||!user?.email_confirmed_at)throw Error("Email not confirmed");
    heading.textContent="Email confirmed";
    details.textContent="Your email has been verified. You can sign in to BatchSave Pro.";
    // Count only newly confirmed accounts and only once per browser.
    const created=Date.parse(user.created_at||"");
    const confirmed=Date.parse(user.email_confirmed_at||"");
    const now=Date.now();
    if(!Number.isFinite(created)||!Number.isFinite(confirmed)||
       Math.abs(now-confirmed)>48*60*60*1000||
       Math.abs(now-created)>48*60*60*1000)return;
    const receipt="batchsave_signup_tracked_"+user.id;
    if(localStorage.getItem(receipt))return;
    localStorage.setItem(receipt,"1");
    window.dataLayer=window.dataLayer||[];
    window.gtag=function(){window.dataLayer.push(arguments);};
    gtag("js",new Date());
    gtag("config","AW-18444391789");
    // This real conversion is emitted only after Supabase verifies a newly confirmed user.
    gtag("event","conversion",{
      send_to:"AW-18444391789/V57vCLmIxrUdE02q_NpE",
      value:0,
      currency:"EUR",
      transaction_id:user.id
    });
    // Load Google Ads after the verification token was removed from the URL.
    const script=document.createElement("script");
    script.async=true;
    script.src="https://www.googletagmanager.com/gtag/js?id=AW-18444391789";
    document.head.appendChild(script);
  }catch{
    heading.textContent="Could not verify confirmation";
    details.textContent="Please use the newest confirmation email and try again, or sign in if your email is already confirmed.";
  }
})();
</script>
</body>
</html>
