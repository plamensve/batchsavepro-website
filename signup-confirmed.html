<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>BatchSave Pro — Email confirmed</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#17233b;background:#f3f6fc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 70% 0,#dceaff,transparent 35%),#f3f6fc}
.card{width:min(470px,100%);background:#fff;border:1px solid #dce5f3;border-radius:18px;padding:28px;box-shadow:0 16px 44px #19396b20}
.brand-row{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{display:block;width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 7px 16px rgba(30,91,220,.22))}
.brand{display:flex;flex-direction:column}.brand strong{font-size:17px}.brand span{font-size:10px;color:#718096}
h1{font-size:24px;margin:0 0 10px;color:#10203d}
p{font-size:14px;line-height:1.6;color:#52657f;margin:0}
.status{margin-top:18px;padding:13px 14px;border-radius:11px;background:#eef4ff;border:1px solid #d4e2f8;color:#345477}
.status.success{background:#effbf5;border-color:#a8dec8;color:#146b4d}
</style>
</head>
<body>
<main class="card">
<div class="brand-row">
<img class="logo" src="/assets/batchsave-logo.png" alt="BatchSave Pro" width="72" height="72">
<div class="brand"><strong>BatchSave Pro</strong><span>Account &amp; billing</span></div>
</div>
<h1 id="heading">Checking confirmation…</h1>
<p id="copy">Verifying the account securely.</p>
<div id="status" class="status">You can return to the BatchSave Pro extension after your email is confirmed.</div>
</main>
<script>
(async()=>{
 const heading=document.getElementById("heading");
 const copy=document.getElementById("copy");
 const status=document.getElementById("status");
 const params=new URLSearchParams(location.hash.slice(1));
 const accessToken=params.get("access_token");
 const type=params.get("type");
 // Supabase Auth returns access tokens in the fragment; remove before loading analytics.
 history.replaceState(null,"",location.pathname);
 // Always initialize the base Google tag for diagnostics, even when no signup token is present.
 // Tokens are removed from the browser URL BEFORE the tag is loaded.
 window.dataLayer=window.dataLayer||[];
 window.gtag=function(){window.dataLayer.push(arguments);};
 gtag("js",new Date());
 gtag("config","AW-18444391789");
 const googleScript=document.createElement("script");
 googleScript.async=true;
 googleScript.src="https://www.googletagmanager.com/gtag/js?id=AW-18444391789";
 document.head.appendChild(googleScript);
 if(!accessToken||!["signup","email"].includes(type)){
   heading.textContent="Email confirmation";
   copy.textContent="Use the latest confirmation link from your email. If already confirmed, sign in to BatchSave Pro.";
   return;
 }
 try{
   const response=await fetch("https://gcfyaaqqsqrjwujpymjz.supabase.co/auth/v1/user",{
     headers:{
       apikey:"sb_publishable_S2ErUIpwWy-lmia3pEHwsw_803Cbb9Q",
       Authorization:"Bearer "+accessToken
     },
     cache:"no-store",
     referrerPolicy:"no-referrer"
   });
   if(!response.ok)throw Error("User verification failed");
   const user=await response.json();
   if(!user?.id||!user.email_confirmed_at)throw Error("Email not confirmed");
   heading.textContent="Email confirmed";
   copy.textContent="Your email address has been confirmed successfully.";
   status.textContent="Return to the BatchSave Pro extension and sign in with your email and password.";
   status.classList.add("success");
   const created=Date.parse(user.created_at||"");
   const confirmed=Date.parse(user.email_confirmed_at||"");
   const now=Date.now();
   // Do not count older accounts reopening their confirmation link.
   if(!Number.isFinite(created)||!Number.isFinite(confirmed)||
      confirmed<created||now-confirmed<0||now-confirmed>48*3600000||
      now-created<0||now-created>30*86400000)return;
   const key="batchsave_signup_conversion_"+user.id;
   if(localStorage.getItem(key))return;
   // Only this event counts as a signup, after Supabase confirms the user.
   gtag("event","conversion",{
     send_to:"AW-18444391789/V57vCLmIxrUdE02q_NpE",
     transaction_id:user.id
   });
   localStorage.setItem(key,"1");
 }catch{
   heading.textContent="Confirmation not verified";
   copy.textContent="Open the newest confirmation email or sign in if your email has already been confirmed.";
 }
})();
</script>
</body>
</html>
